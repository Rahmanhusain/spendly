<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Verify your email</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial;
        color: #0f172a;
      }
      .card {
        max-width: 600px;
        margin: 24px auto;
        padding: 24px;
        border-radius: 8px;
        border: 1px solid #e6edf3;
        background: #fff;
      }
      .otp {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 4px;
      }
      .muted {
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Verify your email for {{appName}}</h2>
      <p class="muted">
        Use the code below to complete your action. This code expires in
        {{expiryMinutes}} minutes.
      </p>
      <p class="otp">{{otp}}</p>
      <p class="muted">
        If you didn't request this, you can ignore this message or contact
        <a href="mailto:{{supportEmail}}">support</a>.
      </p>
    </div>
  </body>
</html>
