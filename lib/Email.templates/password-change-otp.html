<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Password change code</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #f8fafc;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        color: #0f172a;
      }
      .shell {
        padding: 32px 16px;
      }
      .card {
        max-width: 640px;
        margin: 0 auto;
        overflow: hidden;
        border-radius: 24px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 24px 64px rgba(15, 23, 42, 0.08);
      }
      .hero {
        padding: 28px 32px 18px;
        background: linear-gradient(
          135deg,
          #0f172a 0%,
          #111827 48%,
          #0f766e 100%
        );
        color: #fff;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .logo {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.12);
        padding: 6px;
        object-fit: contain;
      }
      .eyebrow {
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.78);
      }
      .title {
        margin: 0;
        font-size: 30px;
        line-height: 1.1;
        font-weight: 700;
      }
      .body {
        padding: 32px;
      }
      .lead {
        margin: 0 0 24px;
        color: #334155;
        font-size: 16px;
        line-height: 1.65;
      }
      .otp-wrap {
        margin: 22px 0 26px;
        padding: 18px;
        border-radius: 18px;
        border: 1px solid #cbd5e1;
        background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      }
      .otp-label {
        margin: 0 0 10px;
        color: #64748b;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .otp {
        margin: 0;
        font-size: 38px;
        line-height: 1;
        letter-spacing: 0.35em;
        font-weight: 800;
        color: #0f172a;
      }
      .meta {
        margin: 0;
        color: #64748b;
        font-size: 14px;
        line-height: 1.6;
      }
      .footer {
        padding: 0 32px 32px;
        color: #64748b;
        font-size: 13px;
        line-height: 1.6;
      }
      a {
        color: #0f766e;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="hero">
          <p class="eyebrow">Security confirmation</p>
          <div class="brand">
            <img class="logo" src="{{logoUrl}}" alt="{{appName}} logo" />
            <div>
              <p class="title">{{appName}}</p>
            </div>
          </div>
        </div>
        <div class="body">
          <p class="lead">
            Use the verification code below to approve your password change.
            This code expires in <strong>{{expiryMinutes}} minutes</strong>.
          </p>
          <div class="otp-wrap">
            <p class="otp-label">Your code</p>
            <p class="otp">{{otp}}</p>
          </div>
          <p class="meta">
            If you did not request this, you can safely ignore this email or
            contact <a href="mailto:{{supportEmail}}">{{supportEmail}}</a>.
          </p>
        </div>
        <div class="footer">Sent securely by {{appName}}.</div>
      </div>
    </div>
  </body>
</html>
