<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>You're invited to {{orgName}}</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #f8fafc;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        color: #0f172a;
      }
      .shell {
        padding: 32px 16px;
      }
      .card {
        max-width: 640px;
        margin: 0 auto;
        overflow: hidden;
        border-radius: 24px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 24px 64px rgba(15, 23, 42, 0.08);
      }
      .hero {
        padding: 28px 32px 18px;
        background: linear-gradient(135deg, #0f172a 0%, #111827 48%, #0f766e 100%);
        color: #fff;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .logo {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.12);
        padding: 6px;
        object-fit: contain;
      }
      .eyebrow {
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.78);
      }
      .title {
        margin: 0;
        font-size: 30px;
        line-height: 1.1;
        font-weight: 700;
      }
      .body {
        padding: 32px;
      }
      .lead {
        margin: 0 0 18px;
        color: #334155;
        font-size: 16px;
        line-height: 1.65;
      }
      .cta {
        display: inline-block;
        margin: 10px 0 18px;
        padding: 14px 22px;
        border-radius: 14px;
        background: linear-gradient(135deg, #0f172a 0%, #0f766e 100%);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
      .linkbox {
        margin: 18px 0 22px;
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        word-break: break-all;
      }
      .meta {
        margin: 0;
        color: #64748b;
        font-size: 14px;
        line-height: 1.6;
      }
      .footer {
        padding: 0 32px 32px;
        color: #64748b;
        font-size: 13px;
        line-height: 1.6;
      }
      a {
        color: #0f766e;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="hero">
          <p class="eyebrow">Workspace invite</p>
          <div class="brand">
            <img class="logo" src="{{logoUrl}}" alt="{{appName}} logo" />
            <div>
              <p class="title">{{appName}}</p>
            </div>
          </div>
        </div>
        <div class="body">
          <p class="lead">
            {{inviterName}} has invited you to join <strong>{{orgName}}</strong>
            on Spendly.
          </p>
          <p>
            <a class="cta" href="{{inviteLink}}">Accept invitation</a>
          </p>
          <div class="linkbox"><a href="{{inviteLink}}">{{inviteLink}}</a></div>
          <p class="meta">This link expires in {{expiryDays}} days.</p>
        </div>
        <div class="footer">
          If this invite was unexpected, you can ignore this email or contact
          <a href="mailto:{{supportEmail}}">{{supportEmail}}</a>.
        </div>
      </div>
    </div>
  </body>
</html>
